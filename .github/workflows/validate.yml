name: Validate themes and native installer
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  prompt:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check against pinned upstream Oh My Zsh
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ohmyzsh/ohmyzsh
          ref: 964ddf789b022b6958b27d02d7fa54f552de21e9
          path: .upstream/ohmyzsh
          persist-credentials: false
      - name: Install Zsh on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes zsh
      - run: python3 scripts/build.py --check
      - run: python3 scripts/build-icons.py --check
      - run: python3 scripts/check-brand.py
      - run: sh -n install.sh && zsh -n bacumi-dark.zsh-theme bacumi-light.zsh-theme lib/prompt.zsh
      - name: Prompt, installer and real Oh My Zsh integration
        env:
          BACUMI_OMZ_DIR: ${{ github.workspace }}/.upstream/ohmyzsh
        run: |
          zsh --version
          python3 -m unittest discover -s tests -v
      - run: python3 scripts/package.py
